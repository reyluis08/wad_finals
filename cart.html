<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Computer Engineering</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/cart.css' %}">
    <iframe src="music.html" allow="autoplay" style="display:none;" id="music-frame"></iframe>
    <script>
        window.onload = function() {
            const iframe = document.getElementById('music-frame');
            iframe.onload = function() {
                iframe.contentWindow.postMessage('play', '*');
            };
        };
    </script>
</head>
<body>
    <header>
        <nav>
            <a href="welcome.html" class="logo">Itech Vision</a>
            <div id="current-time" class="time-display"></div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="needhelp.html">Need Help?</a></li>
                <li><a href="cart.html" class="cart-btn"><span id="cart-count">0</span> 🛒</a></li>
            </ul>
        </nav>
    </header>

    <section class="cart-page">
        <div class="cart-container">
            <h1>Your Shopping Cart</h1>
            
            <div id="cart-items-container">
                <!-- Cart items will be loaded here -->
            </div>
            
            <div id="cart-summary">
                <div id="cart-total">Total: ₱0.00</div>
                <div class="cart-buttons">
                    <button id="continue-shopping">Continue Shopping</button>
                    <button id="checkout-btn">Checkout</button>
                </div>
            </div>
            
            <div id="empty-cart-message" style="display: none;">
                <p>Your cart is empty.</p>
                <button id="start-shopping">Start Shopping</button>
            </div>
        </div>
    </section>

    <script>
        function updateTime() {
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            };
            const philippinesTime = new Date().toLocaleString("en-US", { timeZone: "Asia/Manila", ...options });
            document.getElementById('current-time').innerText = "Current Time in Philippines: " + philippinesTime;
        }

        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', function() {
            const cartItemsContainer = document.getElementById('cart-items-container');
            const cartTotalElement = document.getElementById('cart-total');
            const cartCountElement = document.getElementById('cart-count');
            const emptyCartMessage = document.getElementById('empty-cart-message');
            const checkoutBtn = document.getElementById('checkout-btn');
            const continueShoppingBtn = document.getElementById('continue-shopping');
            const startShoppingBtn = document.getElementById('start-shopping');
            
            // Load cart items from localStorage
            let cartItems = JSON.parse(localStorage.getItem('cart')) || [];
            
            function updateCart() {
                cartCountElement.textContent = cartItems.length;
                cartItemsContainer.innerHTML = '';
                
                if (cartItems.length === 0) {
                    cartItemsContainer.style.display = 'none';
                    cartTotalElement.style.display = 'none';
                    checkoutBtn.style.display = 'none';
                    continueShoppingBtn.style.display = 'none';
                    emptyCartMessage.style.display = 'block';
                } else {
                    cartItemsContainer.style.display = 'block';
                    cartTotalElement.style.display = 'block';
                    checkoutBtn.style.display = 'inline-block';
                    continueShoppingBtn.style.display = 'inline-block';
                    emptyCartMessage.style.display = 'none';
                    
                    const table = document.createElement('table');
                    table.className = 'cart-table';
                    
                    const tableHeader = document.createElement('thead');
                    tableHeader.innerHTML = `
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    `;
                    table.appendChild(tableHeader);
                    
                    const tableBody = document.createElement('tbody');
                    
                    cartItems.forEach((item, index) => {
                        const row = document.createElement('tr');
                        row.className = 'cart-item';
                        row.innerHTML = `
                            <td>${item.item}</td>
                            <td>₱${parseFloat(item.price).toFixed(2)}</td>
                            <td><button class="remove-item" data-index="${index}">Remove</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                    
                    table.appendChild(tableBody);
                    cartItemsContainer.appendChild(table);
                    
                    const total = cartItems.reduce((sum, item) => sum + parseFloat(item.price), 0);
                    cartTotalElement.textContent = `Total: ₱${total.toFixed(2)}`;
                    
                    const removeButtons = document.querySelectorAll('.remove-item');
                    removeButtons.forEach(button => {
                        button.addEventListener('click', function() {
                            const index = parseInt(this.getAttribute('data-index'));
                            cartItems.splice(index, 1);
                            localStorage.setItem('cart', JSON.stringify(cartItems));
                            updateCart();
                        });
                    });
                }
            }
            
            updateCart();
            
            continueShoppingBtn.addEventListener('click', function() {
                window.location.href = 'menu.html';
            });
            
            startShoppingBtn.addEventListener('click', function() {
                window.location.href = 'menu.html';
            });
            
            checkoutBtn.addEventListener('click', function() {
                if (cartItems.length > 0) {
                    alert('Thank you for your purchase!');
                    cartItems = [];
                    localStorage.setItem('cart', JSON.stringify(cartItems));
                    updateCart();
                } else {
                    alert('Your cart is empty!');
                }
            });
        });
    </script>
</body>
</html>
