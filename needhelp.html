<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Engineering</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/needhelp.css' %}">
</head>
<body>    
    <header>
        <nav>
            <a href="welcome.html" class="logo">Itech Vision</a>
            <div id="current-time" class="time-display"></div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="needhelp.html" class="active">Need Help?</a></li>
                <li><a href="cart.html" class="cart-btn"><span id="cart-count">0</span> 🛒</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero"> 
        <div class="hero-content">
            <div class="info-container">
                <h1>Need help? Watch this tutorial on how to assemble your personal computer</h1> 
                
                <div class="video-container">
                    <video controls>
                        <source src="{% static 'core/videos/videoplayback.mp4' %}" type="video/mp4">
                        <source src="{% static 'core/videos/videoplayback.ogg' %}" type="video/ogg">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        </div>
    </section>

    <script>
        function updateTime() {
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            };
            const philippinesTime = new Date().toLocaleString("en-US", { timeZone: "Asia/Manila", ...options });
            document.getElementById('current-time').innerText = "Current Time in Philippines: " + philippinesTime;
        }

        setInterval(updateTime, 1000);
        updateTime(); // Initial call to avoid delay
    </script>
</body>
</html>
